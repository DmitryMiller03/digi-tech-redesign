services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: digitech
      POSTGRES_PASSWORD: digitech
      POSTGRES_DB: digitech
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitech"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://digitech:digitech@db:5432/digitech?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      # Admin-uploaded product images (src/app/api/admin/upload) — without
      # this, anything uploaded at runtime lives only in the container's
      # writable layer and is gone on the next `docker compose up` rebuild.
      - uploads_data:/app/public/uploads

volumes:
  db_data:
  uploads_data:
